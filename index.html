<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge Rush 2D</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU UTAMA -->
    <div id="menu" class="screen">

        <div class="card">

            <h1>🚀 DODGE RUSH</h1>
            <p class="subtitle">2D Web Game</p>

            <input
                type="text"
                id="username"
                placeholder="Masukkan Username"
                maxlength="15"
            >

            <input
                type="tel"
                id="whatsapp"
                placeholder="Nomor WhatsApp"
                maxlength="15"
            >

            <button onclick="startGame()">
                ▶ MULAI BERMAIN
            </button>

            <button class="leaderboard-btn" onclick="showLeaderboard()">
                🏆 LEADERBOARD
            </button>

            <p id="message"></p>

        </div>

    </div>


    <!-- GAME -->
    <div id="gameScreen" class="screen hidden">

        <div class="game-top">

            <div>
                👤 <span id="playerName">Player</span>
            </div>

            <div>
                ⭐ Score: <span id="score">0</span>
            </div>

        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <button id="leftBtn">⬅</button>
            <button id="rightBtn">➡</button>
        </div>

    </div>


    <!-- GAME OVER -->
    <div id="gameOver" class="screen hidden">

        <div class="card">

            <h1>💥 GAME OVER</h1>

            <p>Username:</p>
            <h2 id="finalUsername">Player</h2>

            <p>Skor Kamu:</p>
            <h1 id="finalScore">0</h1>

            <p id="saveStatus"></p>

            <button onclick="backToMenu()">
                🏠 MENU UTAMA
            </button>

            <button class="leaderboard-btn" onclick="showLeaderboard()">
                🏆 LIHAT LEADERBOARD
            </button>

        </div>

    </div>


    <!-- LEADERBOARD -->
    <div id="leaderboard" class="screen hidden">

        <div class="card leaderboard-card">

            <h1>🏆 LEADERBOARD</h1>

            <div id="leaderboardData">
                Memuat data...
            </div>

            <button onclick="backToMenu()">
                🏠 KEMBALI
            </button>

        </div>

    </div>


    <script src="game.js"></script>

</body>
</html>
